[package]
name = "mame-compare"
version = "0.1.0"
edition = "2021"
description = "Golden-frame ROM behaviour comparison harness for the Galaga engine."
license = "MIT"
publish = false

[[bin]]
name = "mame-compare"
path = "src/main.rs"

[dependencies]
galaga-engine = { path = "../../packages/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
